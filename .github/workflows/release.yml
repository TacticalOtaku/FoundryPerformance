name: Release

# Тег v1.2.3 → сборка на Windows, подпись, релиз с latest.json для автообновления.
on:
  push:
    tags: ["v*"]

# Сторонние действия закреплены по хэшу коммита: в этом задании ключ подписи автообновлений,
# и перенесённый на чужой коммит тег не должен попасть в сборку.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      # По хэшу действие не знает, какой тулчейн ставить, — он задаётся явно
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Tag matches app version
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != app version v$v — run: npm run version:set X.Y.Z" }

      - run: npm ci
      - run: npm run build:agent
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer and portable
        run: npm run dist

      - name: Sign installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          npx tauri signer sign --app-version $v "dist-release/FoundryPerformance-$v.exe"

      - name: Release notes and update feed
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          export RELEASE_NOTES="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
          node scripts/make-manifest.mjs

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: dist-release/notes.md
          files: |
            dist-release/FoundryPerformance-*.exe
            dist-release/FoundryPerformance-*-portable.zip
            dist-release/latest.json
